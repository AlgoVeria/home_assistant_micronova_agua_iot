sync_clock:
  target:
    entity:
      domain: climate
set_chrono_program:
  target:
    entity:
      integration: aguaiot
      domain: climate
  fields:
    program:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 6
          mode: box
    start:
      example: "06:00:00"
      selector:
        time:
    stop:
      example: "22:30:00"
      selector:
        time:
    power:
      example: 3
      selector:
        number:
          min: 0
          max: 7
          mode: box
    temperature:
      example: 20.5
      selector:
        number:
          min: 7
          max: 41
          step: 0.5
          unit_of_measurement: "°C"
    days:
      example: '["monday", "tuesday"]'
      selector:
        select:
          multiple: true
          translation_key: weekday
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
